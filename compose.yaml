services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: navalha
      POSTGRES_USER: navalha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navalha_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navalha -d navalha"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
